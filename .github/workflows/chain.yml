# The family's only cross-emulator gate. Each emulator's own CI tests itself
# from source; this runs PUBLISHED images together and proves they still trust
# each other — which is what a bad PUBLIC_ORIGIN or *_ENTRA_ISSUER breaks,
# silently, while every upstream suite stays green.
#
# Two jobs with two meanings, so a red always says whose problem it is:
#
#   certified  the BOM (docker-compose.yml's version defaults). Runs on every
#              push and PR. A red here means THIS REPO is broken — the
#              certified set no longer composes — and blocks the merge.
#
#   drift      :latest across the board. Runs nightly, because this failure
#              mode arrives from OUTSIDE: any of the member repos can publish a
#              release that breaks the family without a commit landing here.
#              A red here means an upstream release needs triage and the BOM
#              is your rollback — a bare `docker compose up` still works.
#
#   pins       the consumer repos' own release pins (keyvault's e2e installs,
#              fabric's fab-driven example) agree with the BOM, so "certified"
#              means the same family everywhere. go.mod library versions are
#              warn-only — a stale one is that repo's own latent problem.
name: Family chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC — catches upstream :latest drift
  workflow_dispatch:

concurrency:
  group: chain-${{ github.ref }}-${{ github.event_name == 'schedule' && 'drift' || 'certified' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for the whole workflow: every job here only checks out and
# runs compose/scripts — no gh api, no GITHUB_TOKEN, no secrets, nothing pushed —
# so read is all the chain needs. Without this the jobs inherit the repository
# default, which can be write-all.
permissions:
  contents: read

jobs:
  # THE DOCS LANE. Jobs that cannot observe a markdown file are gated on
  # `docs_only != 'true'`; the jobs that READ the docs are not, because they
  # must run on exactly those changes. See scripts/docs_only_change.py.
  #
  # Ported from fabric-emulator, which worked this out first.
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history: the classifier diffs against the base, which a depth-1
      # checkout cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Beside the real classification, every time. A classifier that stopped
      # matching would answer `false` forever: safe, plausible, and silently
      # useless. The cases are the only thing that would notice.
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A force push and a branch's first commit both give the null sha.
          # Neither is a docs change; both run everything.
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py

  certified:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: The BOM composes and trusts itself
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest # Docker + compose preinstalled
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate the compose file
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml --profile fabric config >/dev/null
          docker compose -f docker-compose.yml --profile apim config >/dev/null
          docker compose -f docker-compose.yml --profile databricks config >/dev/null
      - name: Run the chain (BOM versions)
        run: ./e2e/chain/run.py
      - name: Diagnose on failure
        if: failure()
        run: |
          docker compose -p azure-emulators-e2e -f docker-compose.yml ps || true
          docker compose -p azure-emulators-e2e -f docker-compose.yml logs --tail 100 || true

  drift:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Does :latest still compose? (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENTRA_EMULATOR_VERSION: latest
      KEYVAULT_EMULATOR_VERSION: latest
      ARM_EMULATOR_VERSION: latest
      FABRIC_EMULATOR_VERSION: latest
      APIM_EMULATOR_VERSION: latest
      DATABRICKS_EMULATOR_VERSION: latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the chain (:latest)
        run: ./e2e/chain/run.py
      - name: Diagnose on failure
        if: failure()
        run: |
          docker compose -p azure-emulators-e2e -f docker-compose.yml ps || true
          docker compose -p azure-emulators-e2e -f docker-compose.yml logs --tail 100 || true

  pins:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Consumer release pins match the BOM
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Prove the gate can still fail before trusting that it passed. A
      # manifest naming a moved repo kept passing on GitHub's rename redirect,
      # so "it passed" and "it checked something" had come apart. No token
      # needed: the self-test never reaches the network for a real repo.
      - run: ./scripts/check_family_pins.py --self-test
      # The gate lists each globbed repo's files through the git-trees API.
      # Unauthenticated that is 60 requests/hour PER SOURCE IP, and Actions
      # runners share IPs, so without a token this check fails intermittently
      # for a reason that has nothing to do with pins — which teaches readers
      # to re-run it rather than read it. GITHUB_TOKEN raises the limit to
      # 1,000/hour for this repo and needs no extra permission beyond the
      # read-only contents scope already granted above.
      - run: ./scripts/check_family_pins.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

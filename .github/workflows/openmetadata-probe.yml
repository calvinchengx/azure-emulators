name: OpenMetadata Fabric probe

# The offline half of probes/openmetadata-fabric: the service-principal login
# check and a dry run, which imports the connector's queries and dialect patches.
# Together they catch a connector release that breaks what the probe tests. The
# live runs need a Fabric tenant or a SQL Server, so they stay manual (README).
on:
  pull_request:
    paths:
      - probes/openmetadata-fabric/**
      - .github/workflows/openmetadata-probe.yml
  push:
    branches: [main]
    paths:
      - probes/openmetadata-fabric/**
      - .github/workflows/openmetadata-probe.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: probes/openmetadata-fabric
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: sudo apt-get install -y --no-install-recommends unixodbc
      - run: uv sync --locked
      - run: uv run python check_auth_url.py
      - run: uv run python fabric_probe.py --dry-run

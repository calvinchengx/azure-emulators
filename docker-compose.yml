# The Azure emulator family, one command.
#
#   docker compose up
#     entra-emulator    :8443  the STS — issues every token, publishes the JWKS
#     keyvault-emulator :8444  Key Vault data plane (secrets, keys, certs)
#     arm-emulator      :8445  ARM control plane + Microsoft.Authorization RBAC
#
#   docker compose --profile fabric up
#     …adds fabric-emulator :9443 (Fabric control plane + OneLake), the
#     consumer that depends on all three. Profiled because it is a much
#     heavier image and most callers of this file don't need it; fabric's own
#     repo carries the richer overlays (compute, rti, governance, terminal).
#
#   docker compose --profile databricks up
#     …adds databricks-emulator :8447 (Databricks workspace REST). Identity
#     is PAT + its own OIDC; entra is an optional federated issuer and
#     keyvault an optional secret backend. Fabric activities submit here
#     only when FABRIC_DATABRICKS_URL is set — the fabric profile does not
#     depend on this one.
#
# WHY THREE CONTAINERS, NOT ONE
# Each emulator is a static Go binary on distroless, so all three share one
# base layer and cost a few tens of MB of RSS — bundling saves essentially
# nothing. What it WOULD cost is fidelity: keyvault and arm validating entra's
# tokens over HTTP against a separate origin IS the production trust
# relationship. Keep the boundary; compose across it.
#
# ISSUER ALIGNMENT IS THE ONE THING THAT MUST MATCH
# Tokens carry iss = <entra login origin>/<tenant>/v2.0, so entra must
# ADVERTISE the origin its peers validate against. On this network that origin
# is https://entra-emulator:8443 — hence PUBLIC_ORIGIN below, and why every
# *_ENTRA_ISSUER repeats it verbatim. Point them at a real tenant instead and
# nothing else changes.
#
# THE VERSION DEFAULTS BELOW ARE THE FAMILY BOM. A bare `docker compose up`
# runs the newest combination proven to work together by this repo's chain
# test — that green is what "certified" means. To bump, change a default and
# open a PR; the chain certifies the new set before it merges. Overrides still
# work, per variable, via the environment or an uncommitted local .env:
#   ENTRA_EMULATOR_VERSION=0.3.1 docker compose up -d      # ad hoc
#   ENTRA_EMULATOR_VERSION=latest                          # what the nightly
#                                                          # drift job does
#
# Release ordering when a bump is breaking: entra first — it is upstream of
# everything — and a release is not done at the tag. The GoReleaser run must
# finish AND the GHCR image must exist; the Go module proxy can carry a new
# version for many minutes while :latest is still the previous image.
#
# STATE PERSISTS HERE, on purpose. Every service below writes its SQLite
# database to a NAMED volume, so a directory you seed once is still there
# tomorrow. Each image already bakes <PREFIX>_DATA_DIR=/data; this file mounts
# a volume there rather than pinning the variable back to "".
#
#   up / down / up   state survives. The named volume outlives the container.
#   stop/start,      same container, same volume, obviously survives.
#   restart
#   down -v          THE reset. Removes the volumes; next `up` is a fresh
#                    directory, a fresh vault, a fresh everything.
#
# So wiping is now the deliberate act, and `down` alone no longer does it.
#
# To go back to throwaway, set the variable to empty — explicitly empty means
# in-memory, and the `-` rather than `:-` below is what makes that reachable:
#   KV_DATA_DIR= docker compose up
# e2e/chain/run.py does exactly that, because a test that inherits yesterday's
# state is not testing what it claims to.
#
# Volume ownership was once a real obstacle here and no longer is: keyvault's
# /data was root-owned while the binary ran as uid 65532, and this file carried
# a note saying persistence was impossible for it. keyvault's Dockerfile chowns
# /data exactly as arm's and fabric's do, and it writes its SQLite DB and TLS
# material as 65532 on a named volume. The note outlived the defect.
#
# entra needs TWO settings, not one. ENTRA_DATA_DIR only supplies the DEFAULT
# for DB_PATH and TLS_CERT_DIR, and entra's image bakes both, so on its own it
# is a no-op in a container — measured against the 0.6.0 image. Both are
# threaded below.

x-entra-tenant: &tenant "6f89cf12-978b-4d23-ac18-9ef0c127cf87"
# The subscription every ARM resource lives under. Stated here rather than
# relying on arm's baked default, because the chain test writes into it and
# released arms (≤0.1.1) still default to the older zero-GUID.
x-arm-subscription: &subscription "6082bfda-63d0-46f4-8272-ae9195139feb"

services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:-0.9.0}
    environment:
      ORIGIN_MODE: compat # single origin, path-prefixed surfaces
      PUBLIC_ORIGIN: "https://entra-emulator:8443"
      # Two, not one (see STATE note above). ENTRA_DATA_DIR only supplies the
      # DEFAULT for DB_PATH, and entra's image bakes that, so the directory
      # alone is a no-op in a container. Both carry the same `-` default, so
      # `ENTRA_DATA_DIR= DB_PATH= docker compose up` still gets you in-memory.
      ENTRA_DATA_DIR: "${ENTRA_DATA_DIR-/app/data}"
      DB_PATH: "${DB_PATH-/app/data/entra-emulator.db}"
      # TLS_CERT_DIR is deliberately left alone. Pinning it empty would work,
      # but the cert would then live only in memory, and `entra-emulator
      # healthcheck` verifies the chain against the cert dir ON DISK. With no
      # dir it fails x509 "unknown authority" forever while the server serves
      # perfectly (JWKS answers fine). Every service below waits on
      # `condition: service_healthy`, so pinning it deadlocks the whole stack
      # on a healthy emulator.
    ports:
      - "${ENTRA_PORT:-8443}:8443" # login / graph / scim / discovery (JWKS)
    volumes:
      - entra-data:/app/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  keyvault-emulator:
    image: ghcr.io/calvinchengx/azure-keyvault-emulator:${KEYVAULT_EMULATOR_VERSION:-0.7.0}
    depends_on:
      entra-emulator:
        condition: service_healthy
      arm-emulator:
        condition: service_healthy
      # Not merely "arm is up" but "the grant exists". The vault polls ARM, so
      # starting before the seed lands would leave a window where the stack is
      # healthy and every data-plane call is a 403.
      arm-seed:
        condition: service_completed_successfully
    ports:
      - "${KEYVAULT_PORT:-8444}:8444" # Key Vault data plane
    environment:
      # Validate bearers against entra's JWKS; aud https://vault.azure.net is a
      # well-known Azure resource in entra-emulator v0.2.1+, so client
      # credentials resolve the vault audience with no resource-app seed step.
      KV_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      KV_ENTRA_TLS_INSECURE: "true" # trust entra's self-signed cert on this network
      # ARM governs the vault: role assignments and the vault resource's own
      # configuration decide who may do what, as in Azure. The `-` rather than
      # `:-` is deliberate — an explicitly empty KV_ARM_URL opts out and
      # restores the permissive stack, while unset gets the default.
      KV_ARM_URL: "${KV_ARM_URL-https://arm-emulator:8445}"
      KV_ARM_RESOURCE_GROUP: &resource_group "${KV_ARM_RESOURCE_GROUP:-emulator-rg}"
      KV_DATA_DIR: "${KV_DATA_DIR-/data}" # see STATE note above
    volumes:
      - keyvault-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/azure-keyvault-emulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  arm-emulator:
    image: ghcr.io/calvinchengx/arm-emulator:${ARM_EMULATOR_VERSION:-0.4.1}
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "${ARM_PORT:-8445}:8445" # ARM control plane (resources, Microsoft.Authorization)
    environment:
      # Same trust wiring as the others. ARM additionally evaluates RBAC role
      # assignments whose principalIds are entra's users/groups/SPs, so the two
      # must agree on the tenant — ARM_TENANT_ID already defaults to it.
      ARM_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      ARM_ENTRA_JWKS_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/discovery/v2.0/keys"
      ARM_ENTRA_TLS_INSECURE: "true"
      ARM_TENANT_ID: *tenant
      ARM_SUBSCRIPTION_ID: *subscription
      ARM_DATA_DIR: "${ARM_DATA_DIR-/data}" # see STATE note above
    volumes:
      - arm-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/arm-emulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Azure gives the principal that creates a vault a grant on it. ARM's rule is
  # no-assignment-means-no-access, so without this the stack would stand up a
  # vault that refuses its own quickstart. One shot, idempotent, and readable:
  # scripts/seed-arm.py is the documentation for doing it by hand.
  arm-seed:
    image: python:3.12-alpine
    restart: "no"
    depends_on:
      arm-emulator:
        condition: service_healthy
    environment:
      SEED_ENTRA_URL: "https://entra-emulator:8443"
      SEED_ARM_URL: "https://arm-emulator:8445"
      SEED_TENANT_ID: *tenant
      SEED_SUBSCRIPTION_ID: *subscription
      SEED_RESOURCE_GROUP: *resource_group
      SEED_VAULT_NAME: "${KV_DEFAULT_VAULT:-emulator}"
      # entra's seeded daemon app, which is also the identity e2e/chain
      # authenticates as — so the chain's probe proves this grant landed.
      SEED_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      SEED_CLIENT_SECRET: "daemon-app-secret"
    volumes:
      - ./scripts/seed-arm.py:/seed.py:ro
    command: ["python3", "/seed.py"]

  # The consumer. Opt in with `--profile fabric`; without the flag this service
  # never starts or pulls.
  fabric-emulator:
    profiles: [fabric]
    image: ghcr.io/calvinchengx/fabric-emulator:${FABRIC_EMULATOR_VERSION:-0.32.0}
    depends_on:
      entra-emulator:
        condition: service_healthy
      keyvault-emulator:
        condition: service_healthy
      arm-emulator:
        condition: service_healthy
    ports:
      - "${FABRIC_PORT:-9443}:9443" # api.fabric + onelake.dfs + portal (host-routed)
    environment:
      FABRIC_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      FABRIC_ENTRA_JWKS_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/discovery/v2.0/keys"
      FABRIC_ENTRA_TLS_INSECURE: "true"
      # REQUIRED since fabric 0.20.0 for vault-backed connection credentials.
      # Resolving one sends a vault-audience bearer token to the host the
      # connection names, so fabric refuses any host not on its allowlist —
      # Azure's own *.vault.azure.net, plus whatever this names. Without it a
      # reference to the vault beside it here is refused at connection create.
      #
      # The SHAPE changed in 0.22.0 and this comment named the old one:
      # `credentialType: "AzureKeyVaultReference"` is not a Fabric credential
      # type and is now rejected. A vault-backed credential is the owning type
      # carrying a reference — `credentialType: "Key"` with
      # `keyReference: {connectionId, secretName}` — where connectionId names a
      # connection of type AzureKeyVault. This variable is unchanged and still
      # required; only the payload that reaches it is different.
      FABRIC_AKV_VAULT_HOST: "keyvault-emulator:8444"
      # ARM-created Microsoft.Fabric/capacities appear on GET /v1/capacities.
      # The `-` rather than `:-` matches KV_ARM_URL: an explicitly empty value
      # opts out (seeded local capacity only); unset gets the sibling.
      FABRIC_ARM_URL: "${FABRIC_ARM_URL-https://arm-emulator:8445}"
      # Databricks activities submit here only when a URL is set. Empty keeps
      # local Spark-agent termination and refuses dbfs: / /Workspace paths.
      # The chain test scrapes databricks's seeded PAT after boot and
      # recreates this service with the three set — a bare
      # `--profile fabric` does not depend on `--profile databricks`.
      FABRIC_DATABRICKS_URL: "${FABRIC_DATABRICKS_URL-}"
      FABRIC_DATABRICKS_TOKEN: "${FABRIC_DATABRICKS_TOKEN-}"
      FABRIC_DATABRICKS_TLS_INSECURE: "${FABRIC_DATABRICKS_TLS_INSECURE-}"
      FABRIC_DATA_DIR: "${FABRIC_DATA_DIR-/data}" # see STATE note above
    volumes:
      - fabric-data:/data

  # API Management: management plane (ARM 2024-05-01), gateway, policies. A
  # consumer like fabric, so it sits behind a profile:
  #   docker compose --profile apim up
  # Its container listens on 8445 — arm's port — so the HOST side moves to
  # 8446; inside the network the two never collide (different containers).
  apim-emulator:
    profiles: [apim]
    image: ghcr.io/calvinchengx/azure-apim-emulator:${APIM_EMULATOR_VERSION:-0.3.0}
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "${APIM_PORT:-8446}:8445" # ARM management surface + gateway
    environment:
      APIM_ENTRA_ISSUER: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      APIM_ENTRA_JWKS_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/discovery/v2.0/keys"
      APIM_ENTRA_TLS_INSECURE: "true"
      APIM_DATA_DIR: "${APIM_DATA_DIR-/data}" # see STATE note above
    volumes:
      - apim-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/azure-apim-emulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Databricks workspace. Identity is PAT + this process's OIDC; entra is
  # an optional federated issuer and keyvault an optional live secret
  # backend. Opt in with `--profile databricks`.
  databricks-emulator:
    profiles: [databricks]
    image: ghcr.io/calvinchengx/databricks-emulator:${DATABRICKS_EMULATOR_VERSION:-0.2.9}
    depends_on:
      entra-emulator:
        condition: service_healthy
      keyvault-emulator:
        condition: service_healthy
    ports:
      - "${DATABRICKS_PORT:-8447}:8447"
    environment:
      DATABRICKS_DATA_DIR: "${DATABRICKS_DATA_DIR-/data}"
      DATABRICKS_PUBLIC_URL: "https://databricks-emulator:8447"
      DATABRICKS_OIDC_ISSUERS: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      DATABRICKS_OIDC_TLS_INSECURE: "true"
      DATABRICKS_AKV_VAULT_HOST: "keyvault-emulator:8444"
      DATABRICKS_AKV_TLS_INSECURE: "true"
      DATABRICKS_ENTRA_TOKEN_URL: "https://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      DATABRICKS_ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      DATABRICKS_ENTRA_CLIENT_SECRET: "daemon-app-secret"
    volumes:
      - databricks-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/databricks-emulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

# Named, so they outlive the containers. `docker compose down` keeps them and
# `down -v` is the reset — see the STATE note at the top. Compose prefixes each
# with the project name, so a stack started under `-p foo` cannot read another
# project's state.
volumes:
  entra-data:
  keyvault-data:
  arm-data:
  fabric-data:
  apim-data:
  databricks-data:
